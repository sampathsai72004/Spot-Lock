.lot-price {
  background: rgba(78, 204, 163, 0.2);
  color: #4ecca3;
  padding: 5px 10px;
  border-radius: 20px;
  font-weight: 600;
}

.lot-details {
  margin-bottom: 20px;
}

.lot-address {
  color: rgba(255,255,255,0.7);
  margin-bottom: 20px;
}

.lot-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat {
  text-align: center;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
}

.stat-label {
  display: block;
  color: rgba(255,255,255,0.7);
  font-size: 0.8rem;
}

.stat-value {
  display: block;
  color: white;
  font-weight: 600;
  font-size: 1.2rem;
}

.stat.available .stat-value {
  color: #4ecca3;
}

.stat.occupied .stat-value {
  color: #ff6b6b;
}

.lot-actions {
  text-align: right;
}

.btn-delete {
  background: rgba(255, 107, 107, 0.1);
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.3);
  padding: 8px 15px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-delete:hover {
  background: rgba(255, 107, 107, 0.2);
}

.btn-delete:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}


@media (max-width: 768px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  
  .lots-grid {
    grid-template-columns: 1fr;
  }
}

body, html {
  min-height: 100vh;
  width: 100vw;
  font-family: 'Inter', 'Segoe UI', 'Roboto', Arial, sans-serif;
  background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
  background-attachment: fixed;
  overflow-x: hidden;
  color: #fff;
}

.display-3, h2, h5 {
  font-weight: 900;
  letter-spacing: -1.2px;
  color: #fff;
  text-shadow: 0 4px 24px rgba(131,58,180,0.15);
}

.glass-card, .card {
  background: rgba(255,255,255,0.16);
  border-radius: 1.5rem;
  border: 1.5px solid rgba(255,255,255,0.22);
  box-shadow: 0 8px 32px 0 rgba(131,58,180,0.18), 0 2px 8px 0 rgba(253,29,29,0.08);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  color: #232946;
  transition: box-shadow 0.18s, transform 0.18s, background 0.18s;
  display: flex;
  flex-direction: column;
}
.glass-card:hover, .card:hover {
  background: rgba(255,255,255,0.26);
  box-shadow: 0 16px 48px rgba(253,29,29,0.22), 0 2px 12px rgba(255,255,255,0.10);
  transform: translateY(-8px) scale(1.025);
}

.form-label {
  color: #833ab4;
  font-weight: 700;
  margin-bottom: 0.25rem;
  letter-spacing: 0.01em;
}

.form-control, .form-select {
  background: rgba(255,255,255,0.13);
  border: 1.5px solid rgba(255,255,255,0.18);
  color: #232946;
  font-weight: 500;
  border-radius: 1.1rem;
  padding: 0.7rem 1rem;
  margin-bottom: 0.7rem;
  box-shadow: 0 2px 8px rgba(131,58,180,0.06);
  transition: background 0.2s, box-shadow 0.2s;
}
.form-control:focus, .form-select:focus {
  background: rgba(255,255,255,0.22);
  box-shadow: 0 4px 16px rgba(253,29,29,0.10);
  color: #232946;
  outline: none;
}


.table-glass {
  background: rgba(255,255,255,0.13);
  border-radius: 1.2rem;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(131,58,180,0.07);
  margin-bottom: 0;
}
.table-glass th, .table-glass td {
  background: transparent;
  color: #232946;
  vertical-align: middle;
  border-top: none;
  border-bottom: 1px solid rgba(131,58,180,0.10);
}
.table-glass th {
  font-weight: 700;
  color: #833ab4;
  background: rgba(255,255,255,0.18);
}
.table-bordered {
  border: none;
}
.table-bordered th, .table-bordered td {
  border: none;
  border-bottom: 1px solid rgba(131,58,180,0.10);
}
.table-glass thead tr {
  border-radius: 1.2rem;
}
.table-glass tbody tr:hover {
  background: rgba(253,29,29,0.07);
  transition: background 0.16s;
}

.user-email {
  font-family: 'Inter', 'Segoe UI', 'Roboto', Arial, sans-serif;
  font-weight: 600;
  color: #833ab4;
  letter-spacing: 0.01em;
}

.badge {
  display: inline-block;
  padding: 0.32em 0.9em;
  border-radius: 1.1em;
  font-size: 0.98em;
  margin-right: 0.3em;
  margin-bottom: 0.1em;
  font-weight: 600;
  border: none;
  box-shadow: 0 1px 6px rgba(253,29,29,0.09);
}
.bg-info {
  background: rgba(75,139,190,0.14) !important;
  color: #4b8bbe !important;
}
.text-success {
  color: #43e97b !important;
  font-weight: 700;
}
.text-danger {
  color: #fd1d1d !important;
  font-weight: 700;
}

.btn-gradient, .btn-success {
  background: linear-gradient(90deg, #833ab4 0%, #fd1d1d 60%, #fcb045 100%);
  color: #fff;
  font-weight: 700;
  border-radius: 2rem;
  border: none;
  box-shadow: 0 2px 12px rgba(253,29,29,0.12), 0 1.5px 8px rgba(131,58,180,0.08);
  transition: background 0.18s, color 0.18s, box-shadow 0.18s, border 0.18s;
  padding: 0.7rem 2.2rem;
  font-size: 1.12rem;
  outline: none;
  letter-spacing: 0.03em;
  backdrop-filter: blur(10px);
}
.btn-gradient:hover, .btn-success:hover, .btn-gradient:focus, .btn-success:focus {
  background: #fff;
  color: #833ab4;
  border: 2px solid #833ab4;
  box-shadow: 0 4px 16px rgba(131,58,180,0.14), 0 2px 8px rgba(253,29,29,0.10);
}
.btn-danger.btn-sm {
  border-radius: 1.2em;
  padding: 0.45em 1.2em;
  font-weight: 600;
  font-size: 1em;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}
.btn-danger.btn-sm:hover {
  background: #fd1d1d;
  color: #fff;
  border-color: #fd1d1d;
}


.spinner-border {
  width: 2.5rem;
  height: 2.5rem;
  border-width: 0.3em;
  border-color: #833ab4 #fd1d1d #fcb045 #fff;
}


@media (max-width: 900px) {
  .container {
    padding-left: 0.5rem;
    padding-right: 0.5rem;
  }
  .glass-card, .card {
    padding: 1.3rem 1rem 1.1rem 1rem;
  }
  .display-3, h2 {
    font-size: 2.1rem;
  }
}
@media (max-width: 600px) {
  .container {
    padding-top: 3vh;
    padding-bottom: 3vh;
  }
  .display-3, h2 {
    font-size: 1.4rem;
  }
  .table-glass {
    font-size: 0.95rem;
  }
}
